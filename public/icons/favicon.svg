<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
>
  <g transform="translate(32 32)">
    <!-- Outer diamond -->
    <rect
      x="-20"
      y="-20"
      width="40"
      height="40"
      rx="2"
      fill="#00eeff"
      transform="rotate(45)"
    />

    <!-- Inner square (black center) -->
    <rect
      x="-8"
      y="-8"
      width="16"
      height="16"
      fill="#050505"
    />
  </g>
</svg>
