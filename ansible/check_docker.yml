---
- name: Check Docker Status
  hosts: all
  become: yes

  tasks:
      - name: Check if Docker binary is present
        command: docker --version
        register: docker_binary_check
        failed_when: false
        changed_when: false

      - name: Check Docker service activity via systemctl
        command: systemctl is-active docker
        register: docker_service_status
        failed_when: false
        changed_when: false

      - name: Check Docker daemon health and accessibility
        command: docker info
        register: docker_info_check
        failed_when: false
        changed_when: false

      - name: Diagnose Docker status
        debug:
            msg: >
                Docker Status Diagnostic:
                {{
                  'Healthy (active and accessible)' if docker_info_check.rc == 0
                  else 'Running but not accessible (permission/socket issue)' if docker_service_status.stdout | trim == 'active'
                  else 'Not Running' if docker_service_status.stdout | trim != 'active' and docker_binary_check.rc == 0
                  else 'Not Installed'
                }}

      - name: SELF-HEALING | Add user to docker group if permission denied
        user:
            name: '{{ ansible_env.SUDO_USER | default(ansible_user) }}'
            groups: docker
            append: yes
        when:
            - docker_service_status.stdout | trim == "active"
            - docker_info_check.rc != 0
            - "'permission denied' in docker_info_check.stderr | lower"

      - name: Start Docker service if it is not active
        systemd:
            name: docker
            state: started
            enabled: yes
        when:
            - docker_binary_check.rc == 0
            - docker_service_status.stdout | trim != "active"

      - name: Verify Docker connectivity with retries
        command: docker ps
        register: docker_ps_test
        until: docker_ps_test.rc == 0
        retries: 3
        delay: 2
        failed_when: false
        changed_when: false

      - name: Show final connectivity result
        debug:
            msg: "Docker is {{ 'fully operational' if docker_ps_test.rc == 0 else 'operational but connectivity test failed' }}"
