---
- name: Deploy Portainer
  hosts: all
  become: yes

  vars:
      # Use latest to ensure compatibility with Docker Engine 29+
      portainer_image: 'portainer/portainer-ce:latest'
      portainer_container: 'portainer'

  tasks:
      - name: Create Portainer volume
        docker_volume:
            name: portainer_data

      - name: Deploy Portainer container
        docker_container:
            name: '{{ portainer_container }}'
            image: '{{ portainer_image }}'
            state: started
            restart_policy: always
            # Ensure we always have the latest pinned version and config updates
            pull: yes
            recreate: yes
            # Silence deprecation warning for tag mismatches
            image_name_mismatch: recreate
            published_ports:
                - '9443:9443'
                - '9000:9000'
            volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - portainer_data:/data

      - name: Show Portainer dashboard URL
        debug:
            msg: 'Portainer is running at https://{{ inventory_hostname }}:9443'
