---
- name: Install Docker
  hosts: all
  become: yes

  tasks:
      - name: PRE-CHECK | Check if Docker binary is present
        command: docker --version
        register: docker_binary_check
        failed_when: false
        changed_when: false

      - name: PRE-CHECK | Diagnose Docker status
        debug:
            msg: 'Docker is already installed. Skipping installation tasks.'
        when: docker_binary_check.rc == 0

      # -------------------------------------------------------------------------
      # INSTALLATION SECTION (Only runs if Docker is NOT installed)
      # -------------------------------------------------------------------------

      - name: INSTALL | Ensure dependencies are installed
        apt:
            name:
                - apt-transport-https
                - ca-certificates
                - curl
                - gnupg
                - lsb-release
            state: present
            update_cache: yes
        when: docker_binary_check.rc != 0

      - name: INSTALL | REMOVE old GPG key (ENSURE CLEAN STATE)
        file:
            path: /usr/share/keyrings/docker.gpg
            state: absent
        when: docker_binary_check.rc != 0

      - name: INSTALL | Ensure keyrings directory exists
        file:
            path: /usr/share/keyrings
            state: directory
            mode: '0755'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Download Docker official GPG key
        get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /tmp/docker.gpg.asc
            mode: '0644'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Dearmor Docker GPG key
        command: gpg --dearmor -o /usr/share/keyrings/docker.gpg /tmp/docker.gpg.asc
        args:
            creates: /usr/share/keyrings/docker.gpg
        when: docker_binary_check.rc != 0

      - name: INSTALL | Ensure dearmored GPG key has correct permissions
        file:
            path: /usr/share/keyrings/docker.gpg
            mode: '0644'
        when: docker_binary_check.rc != 0

      - name: INSTALL | Add Docker repository
        apt_repository:
            repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
            state: present
            filename: docker
        when: docker_binary_check.rc != 0

      - name: INSTALL | Install Docker engine and plugins
        apt:
            name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
            state: present
            update_cache: yes
        when: docker_binary_check.rc != 0

      # -------------------------------------------------------------------------
      # CONFIGURATION SECTION (Always ensures healthy state)
      # -------------------------------------------------------------------------

      - name: CONFIG | Ensure Docker service is running and enabled
        systemd:
            name: docker
            state: started
            enabled: yes

      - name: CONFIG | Ensure docker group exists
        group:
            name: docker
            state: present

      - name: CONFIG | Add user to docker group
        user:
            name: '{{ ansible_env.SUDO_USER | default(ansible_user) }}'
            groups: docker
            append: yes

      - name: VERIFY | Docker installation
        command: docker --version
        register: docker_version
        changed_when: false

      - name: VERIFY | Show Docker version info
        debug:
            var: docker_version.stdout
