name: pipeline

on:
    push:
        branches: [main, dev]
    workflow_dispatch:
        inputs:
            environment:
                description: 'Deployment Environment'
                required: true
                default: 'dev'
                type: choice
                options:
                    - dev
                    - prod
            image_tag:
                description: 'Docker Image Tag (optional, e.g. prod-9045a20). If empty, builds from the current branch.'
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            push_needed: ${{ steps.filter.outputs.push_needed }}
            tag: ${{ steps.vars.outputs.tag }}
            env_name: ${{ steps.vars.outputs.env_name }}
            build_needed: ${{ steps.vars.outputs.build_needed }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check for relevant file changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      push_needed:
                        - 'src/**'
                        - 'public/**'
                        - 'locales/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.ts'
                        - 'Dockerfile'
                        - '.dockerignore'
                        - 'ansible/**'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              if: (steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch') && steps.vars.outputs.build_needed == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ACTOKEN }}

            - name: Set environment variables
              id: vars
              run: |
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    # Manual trigger logic
                    ENV_NAME="${{ github.event.inputs.environment }}"
                    echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

                    if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
                      echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
                      echo "build_needed=false" >> $GITHUB_OUTPUT
                    else
                      echo "tag=${ENV_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "build_needed=true" >> $GITHUB_OUTPUT
                    fi
                  else
                    # Push (Automatic) logic
                    if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                      echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "env_name=prod" >> $GITHUB_OUTPUT
                    else
                      echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "env_name=dev" >> $GITHUB_OUTPUT
                    fi
                    echo "build_needed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Build and push
              if: steps.vars.outputs.build_needed == 'true' && (steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch')
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:${{ steps.vars.outputs.tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
                      NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                      NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
                      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
                      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                      NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                      NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
                      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
                      NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
                      NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS }}
                      NEXT_PUBLIC_TARGET_CHAIN_ID=${{ secrets.NEXT_PUBLIC_TARGET_CHAIN_ID }}
                      NEXT_PUBLIC_IPFS_FEE=${{ secrets.NEXT_PUBLIC_IPFS_FEE }}
                      NEXT_PUBLIC_PINATA_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY_URL }}
                      NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
                      NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
                      NEXTAUTH_SESSION_MAX_AGE=${{ secrets.NEXTAUTH_SESSION_MAX_AGE }}

    deploy:
        needs: build-and-push
        if: (needs.build-and-push.outputs.build_needed == 'true' && needs.build-and-push.outputs.push_needed == 'true') || (github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install ansible passlib

            - name: Check if EC2 Instance is running
              run: |
                  STATE=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=webnode" --query "Reservations[*].Instances[*].State.Name" --output text)
                  echo "Current instance state: $STATE"
                  if [ "$STATE" != "running" ]; then
                    echo "::error::EC2 instance 'webnode' is not running ($STATE). Please run 'Infrastructure - Create or Start' action first."
                    exit 1
                  fi
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: us-east-1

            - name: Set up SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

            - name: Create temporary inventory
              run: |
                  echo "[${{ needs.build-and-push.outputs.env_name }}]" > inventory_ci.ini
                  echo "${{ secrets.REMOTE_HOST }} ansible_user=${{ secrets.REMOTE_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10'" >> inventory_ci.ini

            - name: Deploy via Ansible
              run: |
                  ansible-playbook ansible/deploy_all.yml \
                    -i inventory_ci.ini \
                    -l ${{ needs.build-and-push.outputs.env_name }} \
                    -e "image_tag=${{ needs.build-and-push.outputs.tag }}" \
                    -e "portainer_admin_password=${{ secrets.PORTAINER_ADMIN_PASSWORD }}"
