name: pipeline

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            push_needed: ${{ steps.filter.outputs.push_needed }}
            tag: ${{ steps.vars.outputs.tag }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check for relevant file changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      push_needed:
                        - 'src/**'
                        - 'public/**'
                        - 'locales/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.ts'
                        - 'Dockerfile'
                        - '.dockerignore'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ACTOKEN }}

            - name: Set tag
              id: vars
              run: echo "tag=latest-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: ${{ steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch' }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:${{ steps.vars.outputs.tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
                      NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                      NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
                      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
                      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                      NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                      NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
                      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
                      NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
                      NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS }}
                      NEXT_PUBLIC_TARGET_CHAIN_ID=${{ secrets.NEXT_PUBLIC_TARGET_CHAIN_ID }}
                      NEXT_PUBLIC_IPFS_FEE=${{ secrets.NEXT_PUBLIC_IPFS_FEE }}
                      NEXT_PUBLIC_PINATA_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY_URL }}
                      NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
                      NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
                      NEXTAUTH_SESSION_MAX_AGE=${{ secrets.NEXTAUTH_SESSION_MAX_AGE }}

    deploy:
        needs: build-and-push
        if: github.ref == 'refs/heads/main' && (needs.build-and-push.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install ansible

            - name: Set up SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

            - name: Create temporary inventory
              run: |
                  echo "[webserver]" > inventory_ci.ini
                  echo "${{ secrets.REMOTE_HOST }} ansible_user=${{ secrets.REMOTE_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10'" >> inventory_ci.ini

            - name: Deploy via Ansible
              run: |
                  ansible-playbook ansible/deploy_all.yml \
                    -i inventory_ci.ini \
                    -e "image_tag=${{ needs.build-and-push.outputs.tag }}"
