name: pipeline
run-name: 'Pipeline: ${{ github.event.head_commit.message || github.run_id }} (${{ github.ref_name }})'

on:
    push:
        branches: [main, dev]
    workflow_dispatch:
        inputs:
            environment:
                description: 'Deployment Environment'
                required: true
                default: 'dev'
                type: choice
                options:
                    - dev
                    - prod
            image_tag:
                description: 'Docker Image Tag (optional, e.g. prod-9045a20). If empty, builds from the current branch.'
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            push_needed: ${{ steps.filter.outputs.push_needed }}
            tag: ${{ steps.vars.outputs.tag }}
            env_name: ${{ steps.vars.outputs.env_name }}
            build_needed: ${{ steps.vars.outputs.build_needed }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check for relevant file changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      push_needed:
                        - 'src/**'
                        - 'public/**'
                        - 'locales/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'next.config.ts'
                        - 'Dockerfile'
                        - '.dockerignore'
                        - 'ansible/**'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set environment variables
              id: vars
              run: |
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    # Manual trigger logic
                    ENV_NAME="${{ github.event.inputs.environment }}"
                    echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

                    if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
                      echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
                      echo "build_needed=false" >> $GITHUB_OUTPUT
                    else
                      echo "tag=${ENV_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "build_needed=true" >> $GITHUB_OUTPUT
                    fi

                    if [[ "$ENV_NAME" == "prod" ]]; then
                      echo "backend_url=https://api.brix.social" >> $GITHUB_OUTPUT
                    else
                      echo "backend_url=https://api.dev.brix.social" >> $GITHUB_OUTPUT
                    fi
                  else
                    # Push (Automatic) logic
                    if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                      echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "env_name=prod" >> $GITHUB_OUTPUT
                      echo "backend_url=https://api.brix.social" >> $GITHUB_OUTPUT
                    else
                      echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
                      echo "env_name=dev" >> $GITHUB_OUTPUT
                      echo "backend_url=https://api.dev.brix.social" >> $GITHUB_OUTPUT
                    fi
                    echo "build_needed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Log in to Docker Hub
              if: (steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch') && steps.vars.outputs.build_needed == 'true'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ACTOKEN }}

            - name: Build and push
              if: steps.vars.outputs.build_needed == 'true' && (steps.filter.outputs.push_needed == 'true' || github.event_name == 'workflow_dispatch')
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:${{ steps.vars.outputs.tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-web:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_BACKEND_URL=${{ steps.vars.outputs.backend_url }}
                      NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                      NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
                      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
                      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                      NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                      NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
                      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
                      NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
                      NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_BRIX_CONTRACT_ADDRESS }}
                      NEXT_PUBLIC_TARGET_CHAIN_ID=${{ secrets.NEXT_PUBLIC_TARGET_CHAIN_ID }}
                      NEXT_PUBLIC_IPFS_FEE=${{ secrets.NEXT_PUBLIC_IPFS_FEE }}
                      NEXT_PUBLIC_PINATA_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY_URL }}
                      NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
                      NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
                      NEXTAUTH_SESSION_MAX_AGE=${{ secrets.NEXTAUTH_SESSION_MAX_AGE }}

            - name: Show build summary
              if: always()
              run: |
                  echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
                  echo "### 📦 Docker Image Information" >> $GITHUB_STEP_SUMMARY
                  echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ steps.vars.outputs.env_name }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Primary Tag** | \`${{ steps.vars.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Latest Tag** | \`${{ steps.vars.outputs.env_name }}-latest\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Docker Hub** | [View on Docker Hub](https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/brix-web/tags) |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### 📝 Commit Details" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Message:** \`${{ github.event.head_commit.message }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Author:** \`${{ github.event.head_commit.author.name }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **SHA:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

    update-config:
        needs: build-and-push
        if: (needs.build-and-push.outputs.build_needed == 'true' && needs.build-and-push.outputs.push_needed == 'true') || (github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Config Repo
              uses: actions/checkout@v6
              with:
                  repository: BRIX-ORG/BRIX-Configuration
                  token: ${{ secrets.CONFIG_REPO_PAT }}
                  path: config-repo

            - name: Update Image Tag
              working-directory: config-repo
              run: |
                  ENV_NAME="${{ needs.build-and-push.outputs.env_name }}"
                  IMAGE_TAG="${{ needs.build-and-push.outputs.tag }}"
                  VALUES_FILE="environments/${ENV_NAME}/fe-values.yaml"

                  # Update repository and tag in the values file
                  sed -i -E "s/^(\s*tag:\s*).*$/\1\"${IMAGE_TAG}\"/" $VALUES_FILE
                  sed -i -E "s|^(\s*repository:\s*).*$|\1${{ secrets.DOCKERHUB_USERNAME }}/brix-web|" $VALUES_FILE

            - name: Commit and Push
              working-directory: config-repo
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "chore(auto): update brix-web image tag to ${{ needs.build-and-push.outputs.tag }} [skip ci]" || echo "No changes to commit"
                  git push origin main
