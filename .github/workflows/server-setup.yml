name: initial-server-setup

on:
    workflow_dispatch:
        inputs:
            server_ip:
                description: 'Server IP Address'
                required: true
                default: '11.111.11.111'
            ansible_user:
                description: 'Ansible SSH User'
                required: true
                default: 'ubuntu'

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Ansible
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ansible

            - name: Set up SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ github.event.inputs.server_ip }} >> ~/.ssh/known_hosts

            - name: Run Dependency Installation Playbook
              env:
                  ANSIBLE_HOST_KEY_CHECKING: 'False'
              run: |
                  # Create temporary inventory
                  echo "[webserver]" > inventory_temp.ini
                  echo "${{ github.event.inputs.server_ip }} ansible_user=${{ github.event.inputs.ansible_user }} ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3" >> inventory_temp.ini

                  # Run the dependency installation playbook
                  ansible-playbook -i inventory_temp.ini ansible/install_deps.yml
