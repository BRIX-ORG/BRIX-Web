name: Infrastructure - Create or Start
on:
    workflow_dispatch:

jobs:
    provision:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init
              working-directory: ./terraform
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Terraform Apply
              run: terraform apply -auto-approve
              working-directory: ./terraform
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Get Public IP
              id: tf-output
              run: |
                  IP=$(terraform output -raw instance_public_ip)
                  echo "new_ip=${IP}" >> $GITHUB_OUTPUT
              working-directory: ./terraform
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Update DNS on Name.com
              run: |
                  pip install requests
                  python scripts/update_dns.py
              env:
                  NAME_COM_USERNAME: ${{ secrets.NAME_COM_USERNAME }}
                  NAME_COM_TOKEN: ${{ secrets.NAME_COM_TOKEN }}
                  NEW_IP: ${{ steps.tf-output.outputs.new_ip }}
                  DOMAIN_NAME: 'brix.social'
